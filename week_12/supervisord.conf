[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; Runs ONCE at container boot before app starts
[program:init_dns]
command=/app/init_dns.sh
startsecs=0
autorestart=false
priority=1

; The actual application
[program:app]
command=python3 /app/app.py
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/app.out.log
stderr_logfile=/var/log/app.err.log

